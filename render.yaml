services:
  - type: web
    name: exam-dashboard-backend
    env: node
    plan: free
    rootDir: exam-dashboard/server
    buildCommand: npm install && (pip3 install --break-system-packages -r ../../requirements.txt || python3 -m pip install --break-system-packages -r ../../requirements.txt || true)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3
      - key: CLIENT_URL
        value: https://schedulex-ai-sece.web.app

